name: Pick reminders

# Nudge members who haven't finished their picks, before each week's
# main slates: Wednesday + Saturday evenings and Sunday morning ET.
# Only stragglers are contacted; a full board means no sends at all.
on:
  schedule:
    - cron: '0 21 * * 3'    # Wed 5pm ET (early-week games)
    - cron: '0 22 * * 6'    # Sat 6pm ET
    - cron: '30 13 * * 0'   # Sun 9:30am ET
  workflow_dispatch:

concurrency:
  group: pick-reminders
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Send reminders to stragglers
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: python3 scripts/send_reminders.py
